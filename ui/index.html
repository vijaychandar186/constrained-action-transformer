<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Queen's Gambit - Play chess</title><link rel="stylesheet" href="/style.css"></head>
<body><main><header><div class="eyebrow">QUEEN&#8217;S GAMBIT</div><h1>Your move.</h1><p>Play a game against our chess model.</p></header><div class="layout"><section class="board-wrap" aria-label="Chess game"><div id="board" class="board" aria-label="Chessboard"></div><div id="status" role="status" aria-live="polite">Connecting to the model...</div></section><aside><label for="model">Opponent</label><select id="model"><option value="original">Original large model</option></select><label for="side">Play as</label><select id="side"><option value="w">White</option><option value="b">Black</option></select><div class="actions"><button id="new">New game</button><button id="undo" class="secondary">Undo turn</button><button id="flip" class="secondary">Flip board</button><button id="retry" class="secondary" hidden>Retry move</button></div><div class="moves-title">MOVES</div><ol id="moves" aria-label="Move history"></ol><p class="hint">Select a piece, then a highlighted square. Change your side or opponent to start a new game.</p></aside></div><footer>Trained from scratch. Every move checked against the rules.</footer></main><dialog id="promotion"><h2>Promote your pawn</h2><div id="promotion-options"></div></dialog><script type="module" src="/app.js"></script></body></html>
